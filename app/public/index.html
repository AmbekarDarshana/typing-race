<!DOCTYPE html>
<html>
  <body>
    <h1>Typing Race 🏁</h1>
    <p id="status">Connecting...</p>
    <p id="race-text"></p>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      socket.on("connect", () => {
        document.getElementById("status").textContent = "Connected!";
      });

      socket.on("race:text", (text) => {
        document.getElementById("race-text").textContent = text;
      });
    </script>
  </body>
</html>
